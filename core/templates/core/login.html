<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ISCAC Deals Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen">

    <div class="bg-white p-10 rounded-3xl shadow-xl border border-gray-100 w-full max-w-md">
        <div class="text-center mb-10">
            <h1 class="text-3xl font-black text-slate-900 tracking-tight mb-2">ISCAC-Deals</h1>
            <p class="text-slate-500 font-medium text-sm">Painel de Administração</p>
        </div>

        {% if messages %}
            {% for message in messages %}
                <div class="bg-red-50 text-red-600 p-4 rounded-xl text-sm font-bold mb-6 text-center">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <div class="mb-5">
                <label class="block text-sm font-bold text-slate-700 mb-2">Nome de Utilizador</label>
                <input type="text" name="username" required class="w-full bg-gray-50 border border-gray-200 text-slate-800 rounded-xl focus:ring-blue-500 focus:border-blue-500 block p-4 outline-none transition-all">
            </div>

            <div class="mb-8">
                <label class="block text-sm font-bold text-slate-700 mb-2">Palavra-passe</label>
                <input type="password" name="password" required class="w-full bg-gray-50 border border-gray-200 text-slate-800 rounded-xl focus:ring-blue-500 focus:border-blue-500 block p-4 outline-none transition-all">
            </div>

            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 px-6 rounded-xl shadow-lg shadow-blue-200 transition-all">
                Entrar no Painel de Administração
            </button>
        </form>
    </div>

</body>
</html>
