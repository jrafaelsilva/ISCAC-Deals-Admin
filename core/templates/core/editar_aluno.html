{% extends 'core/base.html' %}

{% block content %}
<div class="max-w-3xl mx-auto p-10">
    <header class="mb-8 flex items-center justify-between">
        <div>
            <a href="/utilizadores/" class="text-dark-600 text-sm font-bold hover:underline flex items-center gap-1 mb-2">
               Voltar aos Alunos
            </a>
            <h1 class="text-3xl font-bold text-gray-900">Editar Aluno</h1>
            <p class="text-gray-500 text-sm">Atualizar informações de {{ aluno.nome }}</p>
        </div>
    </header>

    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6">
        <form method="POST" action="/editar_aluno/{{ aluno.id }}/">
            {% csrf_token %}
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                <div class="col-span-2">
                    <label class="block text-sm font-bold text-gray-700 mb-2">Nome Completo</label>
                    <input type="text" name="nome" value="{{ aluno.nome }}" required class="w-full bg-gray-50 border border-gray-200 text-gray-900 rounded-xl p-3 focus:ring-2 focus:ring-blue-600 focus:outline-none">
                </div>
                
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">Email Institucional</label>
                    <input type="email" name="email" value="{{ aluno.email }}" required class="w-full bg-gray-50 border border-gray-200 text-gray-900 rounded-xl p-3 focus:ring-2 focus:ring-blue-600 focus:outline-none">
                </div>

                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">Curso</label>
                    <select name="id_curso" required class="w-full bg-gray-50 border border-gray-200 text-gray-900 rounded-xl p-3 focus:ring-2 focus:ring-blue-600 focus:outline-none">
                        {% for curso in cursos %}
                            <option value="{{ curso.id }}" {% if aluno.id_curso == curso.id %}selected{% endif %}>
                                {{ curso.nome }}
                            </option>
                        {% endfor %}
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">Ano Curricular</label>
                    <input type="number" name="ano" value="{{ aluno.ano }}" min="1" max="5" required class="w-full bg-gray-50 border border-gray-200 text-gray-900 rounded-xl p-3 focus:ring-2 focus:ring-blue-600 focus:outline-none">
                </div>
            

            <div class="mb-8 p-4 bg-gray-50 rounded-2xl border border-gray-200 flex items-center gap-3">
                <input type="checkbox" name="ativo" id="ativo" value="1" {% if aluno.ativo == 1 %}checked{% endif %} class="w-5 h-5 text-blue-600 rounded focus:ring-blue-600">
                <label for="ativo" class="font-bold text-gray-700 cursor-pointer">Conta Ativa (Permite acesso à plataforma)</label>
            </div>
        </div>
            <div class="flex justify-end gap-3">
                <a href="/utilizadores/" class="px-6 py-3 bg-white border border-gray-200 text-gray-600 font-bold rounded-xl hover:bg-gray-50 transition-colors">Cancelar</a>
                <button type="submit" class="px-6 py-3 bg-blue-600 text-white font-bold rounded-xl shadow-lg shadow-blue-200 hover:bg-blue-700 transition-colors">Guardar Alterações</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
