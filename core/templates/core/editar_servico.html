{% extends 'core/base.html' %}

{% block content %}
<div class="max-w-3xl mx-auto p-10">
    <header class="mb-8 flex items-center justify-between">
        <div>
            <a href="/produtos/" class="text-dark-600 text-sm font-bold hover:underline flex items-center gap-1 mb-2">
               Voltar aos Serviços
            </a>
            <h1 class="text-3xl font-bold text-gray-900">Editar Serviço</h1>
            <p class="text-gray-500 text-sm">Altere as informações ou oculte este serviço da plataforma.</p>
        </div>
    </header>


    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6">
        <form method="POST">
            {% csrf_token %}
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                <div class="col-span-2">
                    <label class="block text-sm font-bold text-slate-700 mb-2">Título do Anúncio</label>
                    <input type="text" name="titulo" value="{{ servico.titulo }}" class="w-full bg-gray-50 border border-gray-200 text-slate-800 rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-3">
                </div>

                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-2">Preço (€)</label>
                    <input type="number" name="preco" value="{{ servico.preco }}" class="w-full bg-gray-50 border border-gray-200 text-slate-800 rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-3">                </div>
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-2">Local de Entrega</label>
                    <input type="text" name="local_entrega" value="{{ servico.local_entrega }}" class="w-full bg-gray-50 border border-gray-200 text-slate-800 rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-3">
                </div>

                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-2">Categoria</label>
                    <select name="id_categoria" class="w-full bg-gray-50 border border-gray-200 text-slate-800 rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-3">
                        {% for cat in categorias %}
                            <option value="{{ cat.id }}" {% if servico.id_categoria == cat.id %}selected{% endif %}>{{ cat.nome }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="col-span-2">
                    <label class="block text-sm font-bold text-slate-700 mb-2">Descrição</label>
                    <textarea name="descricao" rows="4" class="w-full bg-gray-50 border border-gray-200 text-slate-800 rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-3">{{ servico.descricao }}</textarea>
                </div>
           
            <div class="mb-8 flex items-center gap-3 bg-blue-50 p-4 rounded-lg">
                <input type="checkbox" id="ativo" name="ativo" value="1" {% if servico.ativo == 1 %}checked{% endif %} class="w-5 h-5 text-blue-600 bg-white border-gray-300 rounded focus:ring-blue-500">
                <label for="ativo" class="text-sm font-bold text-slate-700">
                    Anúncio Visível <span class="text-xs text-slate-500 font-normal ml-2">(Desmarca para ocultar este artigo na aplicação)</span>
                </label>
            </div>
            </div>
            <div class="flex justify-end gap-3">
                <a href="/servicos/" class="px-6 py-3 bg-white border border-gray-200 text-slate-600 font-bold rounded-lg hover:bg-gray-50 transition-colors">Cancelar</a>
                <button type="submit" class="px-6 py-3 bg-blue-600 text-white font-bold rounded-lg shadow-lg hover:bg-blue-700 transition-colors">Guardar Alterações</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
