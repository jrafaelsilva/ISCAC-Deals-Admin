{% extends 'core/base.html' %}

{% block content %}
<div class="max-w-3xl mx-auto p-10">
    
    <header class="flex justify-between items-center mb-8">
        <div>
            <p class="text-gray-500 text-sm">Painel de Gestão</p>
            <h1 class="text-3xl font-bold text-gray-900 mt-1">Adicionar Aluno</h1>
        </div>
        
        <a href="{% url 'utilizadores' %}" class="bg-white text-slate-500 px-5 py-2.5 rounded-xl font-bold text-sm border border-gray-200 hover:bg-gray-50 transition-all flex items-center gap-2">
            &larr; Voltar
        </a>
    </header>

    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-8">
        
        <form method="POST" action="{% url 'adicionar_aluno' %}" class="flex flex-col gap-6">
            {% csrf_token %} <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-2">Nome Completo</label>
                    <input type="text" name="nome" required placeholder="Ex: João Rafael Santos" class="w-full bg-gray-50 border border-gray-200 text-gray-900 text-sm rounded-xl focus:ring-blue-500 focus:border-blue-500 block p-3 transition-colors outline-none">
                </div>
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-2">Email Institucional</label>
                    <input type="email" name="email" required placeholder="Ex: a2023...@alumni.iscac.pt" class="w-full bg-gray-50 border border-gray-200 text-gray-900 text-sm rounded-xl focus:ring-blue-500 focus:border-blue-500 block p-3 transition-colors outline-none">
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-2">Password Provisória</label>
                    <input type="password" name="password" required placeholder="Definir palavra-passe" class="w-full bg-gray-50 border border-gray-200 text-gray-900 text-sm rounded-xl focus:ring-blue-500 focus:border-blue-500 block p-3 transition-colors outline-none">
                </div>
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-2">Ano Curricular</label>
                    <input type="number" name="ano" required min="1" max="5" placeholder="Ex: 3" class="w-full bg-gray-50 border border-gray-200 text-gray-900 text-sm rounded-xl focus:ring-blue-500 focus:border-blue-500 block p-3 transition-colors outline-none">
                </div>
            </div>

            <div>
                <label class="block text-sm font-bold text-slate-700 mb-2">Curso</label>
                <select name="curso" required class="w-full bg-gray-50 border border-gray-200 text-gray-900 text-sm rounded-xl focus:ring-blue-500 focus:border-blue-500 block p-3 transition-colors outline-none cursor-pointer">
                    <option value="" disabled selected>-- Selecione um curso --</option>
                    {% for curso in cursos %}
                        <option value="{{ curso.id }}">{{ curso.nome }}</option>
                    {% endfor %}
                </select>
            </div>

            <hr class="border-gray-100 my-2">

            <div class="flex items-center justify-between">
                <label class="flex items-center gap-3 cursor-pointer group">
                    <div class="relative flex items-center">
                        <input type="checkbox" name="ativo" checked class="peer sr-only">
                        <div class="w-11 h-6 bg-gray-200 rounded-full peer peer-checked:bg-blue-600 transition-colors"></div>
                        <div class="absolute left-1 top-1 bg-white w-4 h-4 rounded-full transition-transform peer-checked:translate-x-5 shadow-sm"></div>
                    </div>
                    <span class="text-sm font-bold text-slate-600 group-hover:text-slate-900 transition-colors">Conta Ativa</span>
                </label>

                <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-8 rounded-xl shadow-lg shadow-blue-200 transition-all">
                    Gravar Aluno
                </button>
            </div>
            
        </form>

    </div>
</div>
{% endblock %}
